[package]
name = "echolet"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"
crossbeam-channel = "0.5"
clap = { version = "4.5", features = ["derive"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }
tokio = { version = "1.40", features = ["full"] }
libc = "0.2"
ctrlc = "3.4"
arboard = "3.4"
