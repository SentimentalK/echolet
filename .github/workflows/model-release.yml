name: Model Release Pipeline

on:
  push:
    branches:
      - master
    paths:
      - 'models/base-model.json'
  pull_request:
    branches:
      - master
    paths:
      - 'models/base-model.json'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish immutable GitHub Release Asset'
        type: boolean
        required: true
        default: true

permissions:
  contents: write

jobs:
  package-validate-publish:
    name: Package, Validate & Publish Model
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compression & system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd jq curl libasound2-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Package deterministic model artifact (.tar.zst)
        run: |
          ./scripts/package-base-model.sh

      - name: Identify archive and compute checksum
        id: meta
        run: |
          MODEL_ID=$(jq -r '.id' models/base-model.json)
          REV=$(jq -r '.revision' models/base-model.json)
          PKG_NAME="model-${MODEL_ID}-${REV}"
          ARCHIVE_NAME="${PKG_NAME}.tar.zst"
          ARCHIVE_PATH="dist/${ARCHIVE_NAME}"
          SHA256=$(sha256sum "${ARCHIVE_PATH}" | awk '{print $1}')
          TAG="${PKG_NAME}"

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "archive_name=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT
          echo "archive_path=${ARCHIVE_PATH}" >> $GITHUB_OUTPUT
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT

          echo "=== Model Artifact Summary ==="
          echo "Tag:          ${TAG}"
          echo "Archive:      ${ARCHIVE_NAME}"
          echo "SHA256:       ${SHA256}"
          ls -lh "${ARCHIVE_PATH}"

      - name: Test candidate model with automated test suite
        run: |
          ./scripts/download-official-assets.sh
          cargo test --release -- --nocapture

      - name: Upload artifact to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.tag }}
          path: ${{ steps.meta.outputs.archive_path }}
          if-no-files-found: error

      - name: Verify release immutability (fail only if asset already attached)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ARCHIVE_NAME="${{ steps.meta.outputs.archive_name }}"

          # Only block if the specific asset file already exists inside the release.
          # An empty release (tag exists, assets=[]) is fine — we just attach to it.
          if gh release view "${TAG}" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "${ARCHIVE_NAME}"; then
            echo "::error::Asset ${ARCHIVE_NAME} already exists in release ${TAG}! Echolet base models are strictly immutable. To release a new model, bump the revision in models/base-model.json."
            exit 1
          fi
          echo "Immutability check passed: asset ${ARCHIVE_NAME} not yet present in release ${TAG}."

      - name: Publish GitHub Model Release Asset
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Echolet Base Model ${{ steps.meta.outputs.tag }}"
          body: |
            ## Echolet Base Model (${{ steps.meta.outputs.tag }})

            * **Archive**: `${{ steps.meta.outputs.archive_name }}`
            * **Archive SHA256**: `${{ steps.meta.outputs.sha256 }}`

            ```json
            {
              "schema_version": 1,
              "id": "xasr-zh-en-480ms",
              "revision": "r1",
              "archive": "${{ steps.meta.outputs.archive_name }}",
              "url": "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/${{ steps.meta.outputs.archive_name }}",
              "sha256": "${{ steps.meta.outputs.sha256 }}"
            }
            ```
          files: dist/${{ steps.meta.outputs.archive_name }}
