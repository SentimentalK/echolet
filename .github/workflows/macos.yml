name: macOS Build & Test

on:
  workflow_call:
    inputs:
      upload_release:
        type: boolean
        default: false
        description: 'Upload to GitHub Release'
      include_intel:
        type: boolean
        default: false
        description: 'Include Intel (x86_64) runner'
  workflow_dispatch:
    inputs:
      include_intel:
        type: boolean
        default: false
        description: 'Include Intel (x86_64) runner'

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install macOS system dependencies
        run: |
          brew install zstd jq curl

      - name: Cache Cargo dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm64-cargo-

      - name: Cache Echolet Base Model Archive
        uses: actions/cache@v4
        with:
          path: |
            dist/model-*.tar.zst
          key: echolet-base-model-${{ hashFiles('models/base-model.lock.json') }}

      - name: Acquire native runtime and frozen base model
        run: |
          ./scripts/macos/prepare-assets.sh arm64

      - name: Run automated test suite
        run: |
          cargo test --release -- --nocapture

      - name: Build and verify macOS release bundle
        run: |
          ./scripts/macos/build-release.sh arm64

      - name: Publish to GitHub Release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/echolet-macos-arm64.zip

  build-macos-x64:
    name: macOS Intel Build & Test
    if: inputs.include_intel == true || inputs.upload_release == true
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install macOS system dependencies
        run: |
          brew install zstd jq curl

      - name: Cache Cargo dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x64-cargo-

      - name: Cache Echolet Base Model Archive
        uses: actions/cache@v4
        with:
          path: |
            dist/model-*.tar.zst
          key: echolet-base-model-${{ hashFiles('models/base-model.lock.json') }}

      - name: Acquire native runtime and frozen base model
        run: |
          ./scripts/macos/prepare-assets.sh x64

      - name: Run automated test suite
        run: |
          cargo test --release -- --nocapture

      - name: Build and verify macOS release bundle
        run: |
          ./scripts/macos/build-release.sh x64

      - name: Publish to GitHub Release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/echolet-macos-x64.zip
