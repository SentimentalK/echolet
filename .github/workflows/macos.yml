name: macOS Build & Test

on:
  workflow_call:
    inputs:
      upload_release:
        type: boolean
        default: false
        description: 'Upload to GitHub Release'
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS ${{ matrix.name }} Build & Test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            artifact: echolet-macos-arm64
          - arch: x64
            name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: echolet-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install macOS system dependencies
        run: |
          brew install zstd jq curl

      - name: Cache Cargo dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cargo-

      - name: Cache Echolet Base Model Archive
        uses: actions/cache@v4
        with:
          path: |
            dist/model-*.tar.zst
          key: echolet-base-model-${{ hashFiles('models/base-model.lock.json') }}

      - name: Acquire native runtime and frozen base model
        run: |
          ./scripts/macos/prepare-assets.sh ${{ matrix.arch }}

      - name: Run automated test suite
        run: |
          cargo test --release -- --nocapture

      - name: Build and verify macOS release bundle
        run: |
          ./scripts/macos/build-release.sh ${{ matrix.arch }}

      - name: Publish to GitHub Release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}.zip
