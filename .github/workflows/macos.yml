name: macOS Build & Test

on:
  workflow_call:
    inputs:
      upload_release:
        type: boolean
        default: false
        description: 'Upload to GitHub Release'
  workflow_dispatch:

jobs:
  build-macos:
    name: macOS Build & Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Echolet Base Model Archive
        uses: actions/cache@v4
        with:
          path: |
            dist/model-*.tar.zst
            dist/echolet-model-*.tar.zst
            /tmp/model-*.tar.zst
          key: echolet-base-model-${{ hashFiles('models/base-model.lock.json') }}

      - name: "Notice: macOS CI Architecture Ready"
        run: |
          echo "macOS platform build step ready. Consumes same models/base-model.lock.json."
