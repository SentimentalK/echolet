name: Windows Build & Test

on:
  workflow_call:
    inputs:
      upload_release:
        type: boolean
        default: false
        description: 'Upload to GitHub Release'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x86_64 Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x64-cargo-

      - name: Cache Echolet Base Model Archive
        uses: actions/cache@v4
        with:
          path: |
            dist/model-*.tar.zst
          key: echolet-base-model-${{ hashFiles('models/base-model.lock.json') }}

      - name: Acquire Windows native runtime and frozen base model
        shell: pwsh
        run: |
          ./scripts/windows/prepare-assets.ps1 -Architecture x64

      - name: Run automated test suite
        shell: pwsh
        run: |
          # 1. Diagnostic: check bundled runtime DLLs and versions
          Get-ChildItem ".local-runtime\runtime\bin\*.dll"
          $ort = Get-Item ".local-runtime\runtime\bin\onnxruntime.dll"
          Write-Host "Bundled ORT version: $($ort.VersionInfo.FileVersion)"
          Write-Host "Checking for onnxruntime.dll in system PATH:"
          where.exe onnxruntime.dll

          # 2. Build tests without running
          cargo test --release --no-run

          # 3. Ensure test executables load app-local pinned DLLs instead of system32 DLLs
          New-Item -ItemType Directory -Force -Path "target\release" | Out-Null
          New-Item -ItemType Directory -Force -Path "target\release\deps" | Out-Null
          Copy-Item ".local-runtime\runtime\bin\*.dll" "target\release\" -Force
          Copy-Item ".local-runtime\runtime\bin\*.dll" "target\release\deps\" -Force

          # 4. Prepend runtime lib/bin to PATH and run tests
          $env:PATH = "$PWD\.local-runtime\runtime\lib;$PWD\.local-runtime\runtime\bin;$env:PATH"
          cargo test --release -- --nocapture

      - name: Build and verify Windows release package
        shell: pwsh
        run: |
          ./scripts/windows/build-release.ps1 -Architecture x64

      - name: Publish to GitHub Release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/echolet-windows-x64.zip
