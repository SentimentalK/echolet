name: Windows Build & Test

on:
  workflow_call:
    inputs:
      upload_release:
        type: boolean
        default: false
        description: 'Upload to GitHub Release'
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x86_64 Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-x64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-x64-cargo-

      - name: Cache Echolet Base Model Archive
        uses: actions/cache@v4
        with:
          path: |
            dist/model-*.tar.zst
          key: echolet-base-model-${{ hashFiles('models/base-model.lock.json') }}

      - name: Acquire Windows native runtime and frozen base model
        shell: pwsh
        run: |
          ./scripts/windows/prepare-assets.ps1 -Architecture x64

      - name: Run automated test suite
        shell: pwsh
        run: |
          $env:PATH = "$PWD\.local-runtime\runtime\lib;$env:PATH"
          cargo test --release -- --nocapture

      - name: Build and verify Windows release package
        shell: pwsh
        run: |
          ./scripts/windows/build-release.ps1 -Architecture x64

      - name: Publish to GitHub Release
        if: ${{ inputs.upload_release }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/echolet-windows-x64.zip
